name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2.0
        with:
          version: 1.3.296.0

      - name: Install OpenCL SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-SDK.git
          cd OpenCL-SDK
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/opencl-sdk" -DOPENCL_SDK_BUILD_SAMPLES=OFF -DOPENCL_SDK_BUILD_TESTS=OFF
          cmake --build . --config Release --target install
          echo "OPENCL_SDK_PATH=$GITHUB_WORKSPACE/opencl-sdk" >> $GITHUB_ENV
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build ocr_capi
        run: cargo build --release --target ${{ matrix.target }} --features opencl,vulkan
        env:
          OPENCL_DIR: ${{ env.OPENCL_SDK_PATH }}
      
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/ocr_capi.dll artifacts/ocr_capi-windows-x64-gpu.dll
          cp include/ocr_capi.h artifacts/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-${{ matrix.target }}
          path: artifacts/*

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y opencl-headers ocl-icd-opencl-dev libvulkan-dev
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build ocr_capi
        run: cargo build --release --target ${{ matrix.target }} --features opencl,vulkan
      
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/libocr_capi.so artifacts/libocr_capi-linux-x64-gpu.so
          cp include/ocr_capi.h artifacts/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-${{ matrix.target }}
          path: artifacts/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build ocr_capi
        run: cargo build --release --target ${{ matrix.target }} --features metal
      
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.target }}" == "x86_64-apple-darwin" ]; then
            cp target/${{ matrix.target }}/release/libocr_capi.dylib artifacts/libocr_capi-macos-x64.dylib
            cp include/ocr_capi.h artifacts/
          else
            cp target/${{ matrix.target }}/release/libocr_capi.dylib artifacts/libocr_capi-macos-aarch64.dylib
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-${{ matrix.target }}
          path: artifacts/*

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            ndk_triple: aarch64-linux-android
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            ndk_triple: armv7a-linux-androideabi
          - target: x86_64-linux-android
            abi: x86_64
            ndk_triple: x86_64-linux-android
          - target: i686-linux-android
            abi: x86
            ndk_triple: i686-linux-android
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Set Android environment
        run: |
          NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          API_LEVEL=21
          
          echo "ANDROID_NDK_ROOT=${NDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> $GITHUB_ENV
          
          TARGET_UPPER=$(echo "${{ matrix.target }}" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
          TARGET_UNDER=$(echo "${{ matrix.target }}" | tr '-' '_')
          
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=${TOOLCHAIN}/bin/${{ matrix.ndk_triple }}${API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CC_${TARGET_UNDER}=${TOOLCHAIN}/bin/${{ matrix.ndk_triple }}${API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CXX_${TARGET_UNDER}=${TOOLCHAIN}/bin/${{ matrix.ndk_triple }}${API_LEVEL}-clang++" >> $GITHUB_ENV
          echo "AR_${TARGET_UNDER}=${TOOLCHAIN}/bin/llvm-ar" >> $GITHUB_ENV
      
      - name: Build ocr_capi for Android
        run: cargo build --release --target ${{ matrix.target }} --features opencl,vulkan
      
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/jniLibs/${{ matrix.abi }}
          cp target/${{ matrix.target }}/release/libocr_capi.so artifacts/jniLibs/${{ matrix.abi }}/libocr_capi.so
          cp include/ocr_capi.h artifacts/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-${{ matrix.target }}
          path: artifacts/*

  package-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all Android artifacts
        uses: actions/download-artifact@v4
        with:
          path: android-artifacts
      
      - name: Package Android bundle
        run: |
          set -euo pipefail
          
          mkdir -p android-bundle/jniLibs
          mkdir -p android-bundle/include
          
          for target_dir in android-artifacts/ocr_capi-*-linux-android*; do
            if [ -d "${target_dir}/jniLibs" ]; then
              cp -r ${target_dir}/jniLibs/* android-bundle/jniLibs/
            fi
          done
          
          cp include/ocr_capi.h android-bundle/include/
          
          echo "Android bundle structure:"
          find android-bundle -type f
          
          cd android-bundle
          zip -r ../ocr_capi-android.zip .
      
      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-android-bundle
          path: ocr_capi-android.zip

  create-release:
    needs: [build-windows, build-linux, build-macos, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      
      - name: Display structure of downloaded files
        run: ls -R artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
