name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install OpenCL SDK
        shell: pwsh
        run: |
          $sdkUrl = "https://github.com/KhronosGroup/OpenCL-SDK/releases/download/v2024.10.24/OpenCL-SDK-v2024.10.24-Win-x64.zip"
          $sdkZip = "${{ github.workspace }}\opencl-sdk.zip"
          $sdkDir = "${{ github.workspace }}\opencl-sdk"
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip
          Expand-Archive -Path $sdkZip -DestinationPath $sdkDir
          # Find OpenCL.lib location
          $libFile = Get-ChildItem -Path $sdkDir -Filter "OpenCL.lib" -Recurse | Select-Object -First 1
          $incDir = Get-ChildItem -Path $sdkDir -Filter "CL" -Directory -Recurse | Where-Object { Test-Path "$($_.FullName)\cl.h" } | Select-Object -First 1
          Write-Host "OpenCL.lib found at: $($libFile.FullName)"
          Write-Host "CL headers found at: $($incDir.FullName)"
          $libDir = $libFile.DirectoryName
          $includeDir = $incDir.ParentName
          echo "OPENCL_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "OPENCL_INCLUDE_DIR=$includeDir" >> $env:GITHUB_ENV
          # Add OpenCL lib to LIB path
          echo "LIB=$libDir;$env:LIB" >> $env:GITHUB_ENV

      - name: Add Vulkan lib to LIB path
        shell: pwsh
        run: |
          # setup-vulkan-sdk sets VULKAN_SDK env var
          $vulkanLibDir = Join-Path $env:VULKAN_SDK "Lib"
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "Vulkan lib dir: $vulkanLibDir"
          if (Test-Path $vulkanLibDir) {
            Get-ChildItem $vulkanLibDir -Filter "*.lib"
            echo "LIB=$vulkanLibDir;$env:LIB" >> $env:GITHUB_ENV
          } else {
            # Try alternative locations
            $altDir = Join-Path $env:VULKAN_SDK "lib"
            if (Test-Path $altDir) {
              Get-ChildItem $altDir -Filter "*.lib"
              echo "LIB=$altDir;$env:LIB" >> $env:GITHUB_ENV
            } else {
              Write-Host "WARNING: Could not find Vulkan lib directory"
              Get-ChildItem $env:VULKAN_SDK -Recurse -Filter "vulkan.lib" | ForEach-Object {
                Write-Host "Found vulkan.lib at: $($_.FullName)"
                echo "LIB=$($_.DirectoryName);$env:LIB" >> $env:GITHUB_ENV
              }
            }
          }
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build ocr_capi
        run: cargo build --release --target ${{ matrix.target }} --features opencl,vulkan
      
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/ocr_capi.dll artifacts/ocr_capi-windows-x64-gpu.dll
          cp include/ocr_capi.h artifacts/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-${{ matrix.target }}
          path: artifacts/*

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y opencl-headers ocl-icd-opencl-dev libvulkan-dev
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build ocr_capi
        run: cargo build --release --target ${{ matrix.target }} --features opencl,vulkan
      
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/libocr_capi.so artifacts/libocr_capi-linux-x64-gpu.so
          cp include/ocr_capi.h artifacts/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-${{ matrix.target }}
          path: artifacts/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build ocr_capi
        run: cargo build --release --target ${{ matrix.target }} --features metal
      
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.target }}" == "x86_64-apple-darwin" ]; then
            cp target/${{ matrix.target }}/release/libocr_capi.dylib artifacts/libocr_capi-macos-x64.dylib
            cp include/ocr_capi.h artifacts/
          else
            cp target/${{ matrix.target }}/release/libocr_capi.dylib artifacts/libocr_capi-macos-aarch64.dylib
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocr_capi-${{ matrix.target }}
          path: artifacts/*

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      
      - name: Display structure of downloaded files
        run: ls -R artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
